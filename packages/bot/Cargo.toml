[package]
name = "rustcord"
version = "0.1.2"
edition = "2021"

[features]
local-dev = ["dotenv"]
# Opt into fuzzy's AVX2 kernel, skipping its per-call runtime CPU check.
# Only build with this when the *deployment* CPU is known to expose AVX2 — a
# binary built with it will execute an illegal instruction (SIGILL) on a CPU,
# or VM (e.g. a Proxmox `kvm64` guest), that lacks AVX2. Build with
# `cargo build --release -p rustcord --features avx2`.
avx2 = ["fuzzy/avx2"]

[dependencies]
regex = "1.11.1"
dotenv = { version = "0.15.0", optional = true }
serenity = "0.12.4"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1.18.0", features = ["v4", "serde"] }
log = "0.4.27"
env_logger = "0.11.8"
redis = { version = "0.31.0", features = ["tokio-comp"] }
serde = { version = "1.0.219", features = ["derive"] }
ron = "0.10.1"
async-trait = "0.1.89"
thiserror = "2.0.16"
secrecy = "0.8.0"
cards_sdk = { workspace = true }
contracts = { workspace = true }
discord_embeds = { workspace = true }
fuzzy = { workspace = true }
named_lock = { workspace = true }
normalise = { workspace = true }

[dev-dependencies]
cards_sdk = { workspace = true, features = ["test-util"] }
mockall = "0.13.1"
time = { version = "0.3", features = ["serde"] }

[lints]
workspace = true
