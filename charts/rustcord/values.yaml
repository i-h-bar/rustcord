secretName: app-secrets

# true for the cut-over merge: bot+notifier at 0 replicas, CronJobs suspended,
# migrate-images Job rendered. Flip to false in the follow-up merge.
migrationMode: true

cardImages:
  storage: 60Gi

migrateImages:
  # Read-only source for the one-off migration; removed once the host folder is deleted
  hostPath: /var/mtg_cards/

images:
  postgres:
    repository: postgres
    tag: "18"
  redis:
    repository: redis
    tag: 8-alpine
  bot:
    repository: gitfrog/rustcord
    tag: latest
  notifier:
    repository: gitfrog/rustcord-notifier
    tag: latest
  sync:
    repository: gitfrog/rustcord-sync
    tag: latest
  kubectl:
    repository: bitnami/kubectl
    tag: latest

postgres:
  storage: 512Mi
  resources: {}

redis:
  resources: {}

discordBot:
  resources: {}

notifier:
  resources: {}
