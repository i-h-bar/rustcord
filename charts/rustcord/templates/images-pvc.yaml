apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: card-images
  annotations:
    # Once the host folder is deleted this is the only copy of the library;
    # never let helm uninstall/rename delete it (rebuilding means Scryfall).
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.cardImages.storage }}
